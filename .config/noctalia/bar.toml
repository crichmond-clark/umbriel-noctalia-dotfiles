# Keep the existing widgets and layout, but make them separate islands.
[bar.default]
center = ["clock"]
end = ["media", "gabedunn/voxtype:status", "tray", "notifications", "clipboard", "network", "bluetooth", "volume", "brightness", "battery", "control-center", "session"]
background_opacity = 0.0
border_width = 0.0
shadow = false
concave_edge_corners = false
capsule = true
capsule_fill = "surface_variant"
capsule_opacity = 0.95
margin_edge = 6
margin_ends = 0
padding = 6
widget_spacing = 10

# Keep the media island from crowding the centered clock.
[widget.media]
max_length = 170

# Detached panels stay fully opaque instead of merging into the transparent bar.
[shell.panel]
transparency_mode = "solid"
control_center_placement = "floating"
wallpaper_placement = "floating"
session_placement = "floating"
